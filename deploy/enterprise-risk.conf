<VirtualHost *:80>
    ServerName enterprise-risk-anderson.duckdns.org
    DocumentRoot /var/www/enterprise-risk-frontend

    # Keep the ACME challenge on HTTP so certificate renewal works.
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName enterprise-risk-anderson.duckdns.org
    DocumentRoot /var/www/enterprise-risk-frontend

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/enterprise-risk-anderson.duckdns.org/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/enterprise-risk-anderson.duckdns.org/privkey.pem

    <Directory /var/www/enterprise-risk-frontend>
        Options -Indexes
        AllowOverride None
        Require all granted
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ /index.html [L]
    </Directory>

    ProxyPreserveHost On
    ProxyPass /api/ http://127.0.0.1:8080/api/
    ProxyPassReverse /api/ http://127.0.0.1:8080/api/
    RequestHeader set X-Forwarded-Proto "https"
</VirtualHost>
